<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>DM Image Share</title>
    <style>
body {
  margin: 0;
  padding: 0;
  background-color: #1a1a1a;
  color: #ffffff;
  font-family: system-ui, sans-serif;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 100vh;
  overflow: hidden;
}
#setup {
  text-align: center;
}
.role-btn {
  padding: 15px 30px;
  font-size: 1.2rem;
  margin: 10px;
  cursor: pointer;
  border: none;
  border-radius: 5px;
  background-color: #444;
  color: white;
  transition: background 0.2s;
}
.role-btn:hover {
  background-color: #666;
}
#dm-view {
  text-align: center;
  max-width: 1100px;
  width: 95%;
  max-height: 95vh;
  overflow-y: auto;
  padding: 20px;
  box-sizing: border-box;
}
.control-group {
  margin-bottom: 15px;
}
.control-btn {
  padding: 10px 20px;
  font-size: 1rem;
  margin: 5px;
  cursor: pointer;
  border: 2px solid #555;
  background-color: #222;
  color: white;
  border-radius: 5px;
  transition: all 0.2s;
}
.control-btn:hover {
  background-color: #333;
}
.control-btn.blackout-active {
  border-color: #e74c3c;
  background-color: #3d1b1b;
}
#slots-container {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
  gap: 15px;
  margin-top: 15px;
  width: 100%;
}
.slot-card {
  background-color: #222;
  border: 3px dashed #555;
  border-radius: 8px;
  padding: 10px;
  cursor: pointer;
  outline: none;
  display: flex;
  flex-direction: column;
  transition: all 0.2s;
  position: relative;
}
.slot-card:focus-within {
  border-color: #3498db;
  background-color: #1a2a3a;
}
.slot-card.drag-over {
  border-color: #2ecc71;
  background-color: #1b3d22;
}
.slot-card.dragging {
  opacity: 0.4;
}
.slot-card.has-image {
  border-style: solid;
  border-color: #444;
}
.slot-card.has-image.showing {
  border-color: #2ecc71;
}
.slot-header {
  display: flex;
  align-items: center;
  gap: 6px;
  font-weight: bold;
  font-size: 0.9rem;
  margin-bottom: 8px;
  color: #aaa;
  pointer-events: none;
}
.drag-handle {
  cursor: grab;
  pointer-events: auto;
  color: #777;
}
.drag-handle:active {
  cursor: grabbing;
}
.thumb-preview {
  width: 100%;
  height: 110px;
  border: 1px solid #333;
  background-color: #111;
  border-radius: 4px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #444;
  font-size: 0.8rem;
  overflow: hidden;
  pointer-events: none;
}
.thumb-preview img {
  max-width: 100%;
  max-height: 100%;
  object-fit: contain;
}
.caption-input {
  width: 100%;
  padding: 6px;
  margin-top: 8px;
  background-color: #111;
  border: 1px solid #444;
  color: white;
  border-radius: 4px;
  box-sizing: border-box;
  font-size: 0.85rem;
  outline: none;
  transition: border-color 0.2s;
}
.caption-input:focus {
  border-color: #3498db;
}
.caption-input:disabled {
  opacity: 0.3;
  cursor: not-allowed;
}
.slot-controls {
  display: flex;
  gap: 5px;
  margin-top: 8px;
}
.slot-btn {
  flex: 1;
  padding: 6px;
  font-size: 0.75rem;
  font-weight: bold;
  border: none;
  border-radius: 4px;
  cursor: pointer;
  color: white;
  transition:
    background 0.2s,
    opacity 0.2s;
}
.slot-btn:disabled {
  opacity: 0.3;
  cursor: not-allowed;
  background-color: #333 !important;
}
.toggle-btn {
  background-color: #444;
}
.toggle-btn.showing {
  background-color: #2ecc71;
}
.toggle-btn.showing:hover {
  background-color: #27ae60;
}
.remove-btn {
  background-color: #e74c3c;
}
.remove-btn:hover {
  background-color: #c0392b;
}
#display-container {
  display: none;
  width: 100vw;
  height: 100vh;
  background-color: #1a1a1a;
  box-sizing: border-box;
  padding: 20px;
  gap: 20px;
  overflow: hidden;
}
.player-row {
  display: flex;
  flex-direction: row;
  width: 100%;
  height: 100%;
  min-height: 0;
  gap: 20px;
  justify-content: center;
  align-items: center;
}
.player-img-wrapper {
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  height: 100%;
  width: 100%;
  overflow: hidden;
}
.player-img {
  flex: 1;
  min-height: 0;
  max-width: 100%;
  max-height: 100%;
  object-fit: contain;
  border-radius: 4px;
}
.player-caption {
  margin-top: 10px;
  font-size: 1.4rem;
  font-weight: bold;
  text-align: center;
  color: #ffffff;
  background-color: rgba(0, 0, 0, 0.7);
  padding: 6px 16px;
  border-radius: 5px;
  max-width: 90%;
  word-wrap: break-word;
  box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
  flex-shrink: 0;
}
#player-placeholder {
  font-size: 1.8rem;
  color: #444;
  font-weight: bold;
  text-align: center;
  border: 2px dashed #333;
  padding: 40px 60px;
  border-radius: 10px;
}
#blackout-overlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  background-color: #1a1a1a;
  display: none;
  z-index: 9999;
}

</style>
  </head>
  <body>
    <!-- Role Selection (Shows on load) -->
    <div id="setup">
      <h2>Select Role for this Window:</h2>
      <button class="role-btn" onclick="initRole('dm')">DM (Sender)</button>
      <button class="role-btn" onclick="initRole('player')">
        Players (Receiver)
      </button>
    </div>

    <!-- DM View -->
    <div id="dm-view" style="display: none">
      <h2>DM Control Panel</h2>
      <div class="control-group">
        <button
          class="control-btn"
          id="btn-blackout"
          onclick="toggleBlackout()"
        >
          Hide Screen
        </button>
        <button class="control-btn" onclick="exportSession()">
          Export Session
        </button>
        <button class="control-btn" onclick="triggerImport()">
          Import Session
        </button>
        <button class="control-btn" onclick="addSlots()">Add 5 Slots</button>
        <input
          type="file"
          id="import-file-input"
          accept=".json"
          style="display: none"
          onchange="importSession(event)"
        />
      </div>
      <p style="font-size: 0.9rem; color: #aaa; margin-bottom: 5px">
        Click a slot to select it, then paste ('Ctrl + V'), or drag and drop an
        image file directly into it.
      </p>
      <div id="slots-container"></div>
      <p style="margin-top: 20px">
        Status: <span id="status" style="color: #2ecc71">Ready</span>
      </p>
    </div>

    <!-- Player View Container -->
    <div id="display-container">
      <div id="player-placeholder">Waiting for DM...</div>
    </div>

    <!-- Blackout Screen Overlay -->
    <div id="blackout-overlay"></div>

    <script>

const INITIAL_SLOTS = 5;
const SLOTS_PER_ROW = 5;
let slots = [];

function createSlot(id) {
  return { id, image: null, caption: "", visible: false };
}

function buildSlotCard(i) {
  const container = document.getElementById("slots-container");
  const card = document.createElement("div");
  card.className = "slot-card";
  card.id = `slot-card-${i}`;
  card.dataset.slot = i;
  card.tabIndex = 0;
  card.innerHTML = `
        <div class="slot-header">
            <span class="drag-handle" draggable="true" title="Drag to reorder">\u2630</span>
            <span class="slot-label">Slot ${i}</span>
        </div>
        <div class="thumb-preview" id="thumb-${i}">No Image Loaded</div>
        <input type="text" class="caption-input" id="caption-${i}" placeholder="Enter caption..." oninput="updateCaption(${i}, this.value)" disabled>
        <div class="slot-controls">
            <button class="slot-btn toggle-btn" id="toggle-${i}" onclick="toggleSlot(${i}, event)" disabled>Show</button>
            <button class="slot-btn remove-btn" id="remove-${i}" onclick="clearSlot(${i}, event)" disabled>Remove</button>
        </div>
    `;
  container.appendChild(card);
  setupBoxListeners(card, i);

  const handle = card.querySelector(".drag-handle");
  handle.addEventListener("dragstart", (e) => handleDragStart(e, i));
  handle.addEventListener("dragend", handleDragEnd);
}

function renderAllSlots() {
  document.getElementById("slots-container").innerHTML = "";
  slots.forEach((slot) => {
    buildSlotCard(slot.id);
    updateSlotUI(slot.id);
  });
}

function addSlots() {
  for (let i = 0; i < SLOTS_PER_ROW; i++) {
    const id = slots.length + 1;
    slots.push(createSlot(id));
    buildSlotCard(id);
    updateSlotUI(id);
  }
  const status = document.getElementById("status");
  status.textContent = `${SLOTS_PER_ROW} slots added (${slots.length} total)`;
  status.style.color = "#2ecc71";
}

function setupDM() {
  slots = Array.from({ length: INITIAL_SLOTS }, (_, i) => createSlot(i + 1));
  renderAllSlots();

  document.addEventListener("paste", (e) => {
    const activeCard = document.activeElement;
    if (activeCard && activeCard.classList.contains("slot-card")) {
      const slotId = parseInt(activeCard.dataset.slot);
      const items = e.clipboardData.items;
      for (let i = 0; i < items.length; i++) {
        if (items[i].type.startsWith("image/")) {
          const file = items[i].getAsFile();
          processImageFile(file, slotId);
          break;
        }
      }
    }
  });

  document.getElementById("slot-card-1").focus();
}

function setupBoxListeners(element, slotId) {
  ["dragenter", "dragover", "dragleave", "drop"].forEach((eventName) => {
    element.addEventListener(eventName, (e) => e.preventDefault(), false);
  });
  ["dragenter", "dragover"].forEach((eventName) => {
    element.addEventListener(
      eventName,
      () => element.classList.add("drag-over"),
      false,
    );
  });
  ["dragleave", "drop"].forEach((eventName) => {
    element.addEventListener(
      eventName,
      () => element.classList.remove("drag-over"),
      false,
    );
  });
  element.addEventListener("drop", (e) => {
    const files = e.dataTransfer.files;
    const sourceId = e.dataTransfer.getData("text/plain");
    if (files.length > 0) {
      processImageFile(files[0], slotId);
    } else if (sourceId) {
      reorderSlots(parseInt(sourceId, 10), slotId);
    }
  });
  element.addEventListener("click", (e) => {
    if (e.target.tagName !== "INPUT" && e.target.tagName !== "BUTTON") {
      element.focus();
    }
  });
}

function processImageFile(file, slotId) {
  if (!file || !file.type.startsWith("image/")) return;
  const status = document.getElementById("status");
  status.textContent = "Processing image...";
  status.style.color = "#e67e22";
  const reader = new FileReader();
  reader.onload = function (event) {
    const base64Image = event.target.result;
    const idx = slotId - 1;
    slots[idx].image = base64Image;
    slots[idx].visible = false;
    updateSlotUI(slotId);
    broadcastState();
    status.textContent = `Slot ${slotId} loaded privately!`;
    status.style.color = "#2ecc71";
  };
  reader.readAsDataURL(file);
}

function updateSlotUI(slotId) {
  const idx = slotId - 1;
  const slot = slots[idx];
  const card = document.getElementById(`slot-card-${slotId}`);
  const thumb = document.getElementById(`thumb-${slotId}`);
  const toggleBtn = document.getElementById(`toggle-${slotId}`);
  const removeBtn = document.getElementById(`remove-${slotId}`);
  const captionInput = document.getElementById(`caption-${slotId}`);
  if (slot.image) {
    card.classList.add("has-image");
    thumb.innerHTML = `<img src="${slot.image}" alt="Thumbnail">`;
    toggleBtn.disabled = false;
    removeBtn.disabled = false;
    captionInput.disabled = false;
    captionInput.value = slot.caption || "";
    if (slot.visible) {
      card.classList.add("showing");
      toggleBtn.textContent = "Hide";
      toggleBtn.classList.add("showing");
    } else {
      card.classList.remove("showing");
      toggleBtn.textContent = "Show";
      toggleBtn.classList.remove("showing");
    }
  } else {
    card.className = "slot-card";
    thumb.innerHTML = "No Image Loaded";
    toggleBtn.textContent = "Show";
    toggleBtn.classList.remove("showing");
    toggleBtn.disabled = true;
    removeBtn.disabled = true;
    captionInput.value = "";
    captionInput.disabled = true;
  }
}

function updateCaption(slotId, text) {
  const idx = slotId - 1;
  slots[idx].caption = text;
  broadcastState();
}

function handleDragStart(e, slotId) {
  e.dataTransfer.setData("text/plain", String(slotId));
  e.dataTransfer.effectAllowed = "move";
  e.currentTarget.closest(".slot-card").classList.add("dragging");
}

function handleDragEnd() {
  document
    .querySelectorAll(".slot-card.dragging")
    .forEach((el) => el.classList.remove("dragging"));
}

function reorderSlots(sourceId, targetId) {
  if (sourceId === targetId || isNaN(sourceId)) return;
  const [moved] = slots.splice(sourceId - 1, 1);
  slots.splice(targetId - 1, 0, moved);
  slots.forEach((slot, i) => {
    slot.id = i + 1;
  });
  renderAllSlots();
  broadcastState();
  const status = document.getElementById("status");
  status.textContent = `Slot moved to position ${targetId}`;
  status.style.color = "#3498db";
}

function toggleSlot(slotId, event) {
  if (event) event.stopPropagation();
  const idx = slotId - 1;
  if (!slots[idx].image) return;
  slots[idx].visible = !slots[idx].visible;
  updateSlotUI(slotId);
  broadcastState();
}

function clearSlot(slotId, event) {
  if (event) event.stopPropagation();
  const idx = slotId - 1;
  slots[idx].image = null;
  slots[idx].visible = false;
  slots[idx].caption = "";
  updateSlotUI(slotId);
  broadcastState();
  const status = document.getElementById("status");
  status.textContent = `Slot ${slotId} removed!`;
  status.style.color = "#e74c3c";
}

function toggleBlackout() {
  isBlackout = !isBlackout;
  const btn = document.getElementById("btn-blackout");
  btn.textContent = isBlackout ? "Show Screen" : "Hide Screen (Blackout)";
  btn.classList.toggle("blackout-active", isBlackout);
  channel.postMessage({ type: "blackout", active: isBlackout });
}

function exportSession() {
  const jsonString = JSON.stringify(slots);
  const blob = new Blob([jsonString], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `dm_session_${new Date().toISOString().slice(0, 10)}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  const status = document.getElementById("status");
  status.textContent = "Session exported successfully!";
  status.style.color = "#2ecc71";
}

function triggerImport() {
  document.getElementById("import-file-input").click();
}

function importSession(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function (e) {
    try {
      const importedSlots = JSON.parse(e.target.result);
      if (Array.isArray(importedSlots) && importedSlots.length > 0) {
        slots = importedSlots.map((slot, i) => ({
          ...createSlot(i + 1),
          ...slot,
          id: i + 1,
        }));
        renderAllSlots();
        broadcastState();
        const status = document.getElementById("status");
        status.textContent = "Session loaded successfully!";
        status.style.color = "#2ecc71";
      } else {
        alert("Invalid save file format.");
      }
    } catch (err) {
      alert("Failed to parse save file.");
    }
    event.target.value = "";
  };
  reader.readAsText(file);
}

function broadcastState() {
  const visibleItems = slots
    .filter((s) => s.image && s.visible)
    .map((s) => ({ image: s.image, caption: s.caption }));
  channel.postMessage({ type: "sync", items: visibleItems });
}

let currentRenderTaskId = 0;

function setupPlayer() {
  channel.onmessage = function (event) {
    const msg = event.data;
    if (!msg) return;
    if (msg.type === "sync") {
      renderPlayerGrid(msg.items);
    } else if (msg.type === "blackout") {
      document.getElementById("blackout-overlay").style.display = msg.active
        ? "block"
        : "none";
    }
  };
}

function getImageAspectRatio(base64) {
  return new Promise((resolve) => {
    const img = new Image();
    img.onload = () => resolve(img.naturalWidth / img.naturalHeight);
    img.onerror = () => resolve(1.0);
    img.src = base64;
  });
}

const ROW_GAP = 20;
const IMG_GAP = 20;

function getContainerAvailableSize() {
  const container = document.getElementById("display-container");
  const rect = container.getBoundingClientRect();
  const cs = getComputedStyle(container);
  const paddingX = parseFloat(cs.paddingLeft) + parseFloat(cs.paddingRight);
  const paddingY = parseFloat(cs.paddingTop) + parseFloat(cs.paddingBottom);
  return { width: rect.width - paddingX, height: rect.height - paddingY };
}

// Area actually covered by images (object-fit: contain) if grouped items[start..end] form one row.
function computeRowUsedArea(items, start, end, rowWidth, rowHeight) {
  const count = end - start + 1;
  const availWidth = rowWidth - (count - 1) * IMG_GAP;
  let ratioSum = 0;
  for (let i = start; i <= end; i++) ratioSum += items[i].ratio;

  let used = 0;
  for (let i = start; i <= end; i++) {
    const ratio = items[i].ratio;
    const boxWidth = (ratio / ratioSum) * availWidth;
    const boxAspect = boxWidth / rowHeight;
    const imgWidth = boxAspect > ratio ? rowHeight * ratio : boxWidth;
    const imgHeight = boxAspect > ratio ? rowHeight : boxWidth / ratio;
    used += imgWidth * imgHeight;
  }
  return used;
}

// Best contiguous split of items into exactly numRows rows, maximizing displayed image area.
function partitionIntoRows(items, numRows, containerWidth, containerHeight) {
  const n = items.length;
  const rowHeight = (containerHeight - (numRows - 1) * ROW_GAP) / numRows;
  if (rowHeight <= 0) return null;

  const dp = Array.from({ length: numRows + 1 }, () =>
    new Array(n + 1).fill(-Infinity),
  );
  const split = Array.from({ length: numRows + 1 }, () =>
    new Array(n + 1).fill(-1),
  );
  dp[0][0] = 0;

  for (let row = 1; row <= numRows; row++) {
    for (let i = row; i <= n; i++) {
      for (let m = row - 1; m < i; m++) {
        if (dp[row - 1][m] === -Infinity) continue;
        const value =
          dp[row - 1][m] +
          computeRowUsedArea(items, m, i - 1, containerWidth, rowHeight);
        if (value > dp[row][i]) {
          dp[row][i] = value;
          split[row][i] = m;
        }
      }
    }
  }

  if (dp[numRows][n] === -Infinity) return null;

  const rows = [];
  let i = n;
  for (let row = numRows; row >= 1; row--) {
    const m = split[row][i];
    rows.unshift(items.slice(m, i));
    i = m;
  }
  return { rows, usedArea: dp[numRows][n] };
}

// Picks the row grouping (1..4 rows) that maximizes total displayed image area.
function getOptimalRows(items, containerWidth, containerHeight) {
  const n = items.length;
  if (n <= 1) return [items];

  let best = null;
  const maxRows = Math.min(4, n);
  for (let numRows = 1; numRows <= maxRows; numRows++) {
    const result = partitionIntoRows(
      items,
      numRows,
      containerWidth,
      containerHeight,
    );
    if (result && (!best || result.usedArea > best.usedArea)) {
      best = result;
    }
  }
  return best ? best.rows : [items];
}

async function renderPlayerGrid(items) {
  const taskId = ++currentRenderTaskId;
  const container = document.getElementById("display-container");
  const placeholder = document.getElementById("player-placeholder");

  const currentWrappers = container.querySelectorAll(
    ".player-row, .player-img-wrapper",
  );
  currentWrappers.forEach((wrap) => wrap.remove());

  const itemsToShow = items.slice(0, 9);

  if (!itemsToShow || itemsToShow.length === 0) {
    placeholder.style.display = "block";
    container.style.display = "flex";
    container.style.flexDirection = "column";
    return;
  }

  placeholder.style.display = "none";
  container.style.display = "flex";
  container.style.flexDirection = "column";
  container.style.justifyContent = "center";
  container.style.alignItems = "center";
  container.style.gap = "20px";

  const itemsWithRatios = await Promise.all(
    itemsToShow.map(async (item) => {
      const ratio = await getImageAspectRatio(item.image);
      return { ...item, ratio };
    }),
  );

  if (taskId !== currentRenderTaskId) return;

  const { width, height } = getContainerAvailableSize();
  const rowsData = getOptimalRows(itemsWithRatios, width, height);

  rowsData.forEach((rowData) => {
    const rowDiv = document.createElement("div");
    rowDiv.className = "player-row";

    rowData.forEach((item) => {
      const wrapper = document.createElement("div");
      wrapper.className = "player-img-wrapper";
      wrapper.style.flex = `${item.ratio} 1 0%`;

      const img = document.createElement("img");
      img.className = "player-img";
      img.src = item.image;
      wrapper.appendChild(img);

      if (item.caption && item.caption.trim() !== "") {
        const caption = document.createElement("div");
        caption.className = "player-caption";
        caption.textContent = item.caption;
        wrapper.appendChild(caption);
      }

      rowDiv.appendChild(wrapper);
    });

    container.appendChild(rowDiv);
  });
}

const channel = new BroadcastChannel("dm_screen_share_pro_grid");
let isBlackout = false;

function initRole(role) {
  document.getElementById("setup").style.display = "none";
  if (role === "dm") {
    document.title = "Sender - DM Image Share";
    document.getElementById("dm-view").style.display = "block";
    setupDM();
  } else {
    document.title = "Receiver - DM Image Share";
    setupPlayer();
    renderPlayerGrid([]);
  }
}


</script>
  </body>
