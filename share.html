<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>DM Screen Share Pro</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        background-color: #1a1a1a;
        color: #ffffff;
        font-family: system-ui, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        overflow: hidden;
      }
      #setup {
        text-align: center;
      }
      .role-btn {
        padding: 15px 30px;
        font-size: 1.2rem;
        margin: 10px;
        cursor: pointer;
        border: none;
        border-radius: 5px;
        background-color: #444;
        color: white;
        transition: background 0.2s;
      }
      .role-btn:hover {
        background-color: #666;
      }

      /* DM Control Panel Panel Styling */
      #dm-view {
        text-align: center;
        max-width: 800px;
        width: 90%;
      }
      .control-group {
        margin-bottom: 20px;
      }
      .control-btn {
        padding: 10px 20px;
        font-size: 1rem;
        margin: 5px;
        cursor: pointer;
        border: 2px solid #555;
        background-color: #222;
        color: white;
        border-radius: 5px;
        transition: all 0.2s;
      }
      .control-btn:hover {
        background-color: #333;
      }
      .control-btn.active {
        border-color: #2ecc71;
        background-color: #1b3d22;
      }
      .control-btn.blackout-active {
        border-color: #e74c3c;
        background-color: #3d1b1b;
      }

      /* Interactive Paste/Drop Boxes */
      .paste-container {
        display: flex;
        justify-content: center;
        gap: 20px;
        margin-top: 20px;
        height: 250px;
      }
      .paste-box {
        flex: 1;
        position: relative; /* Allows absolute positioning for the remove button */
        border: 3px dashed #666;
        border-radius: 10px;
        padding: 15px;
        cursor: pointer;
        background-color: #222;
        outline: none;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: space-between;
        transition: all 0.2s;
        box-sizing: border-box;
      }
      .paste-box:focus {
        border-color: #3498db;
        background-color: #1a2a3a;
      }
      /* Highlight box when dragging a file over it */
      .paste-box.drag-over {
        border-color: #2ecc71;
        background-color: #1b3d22;
      }
      .box-label {
        font-weight: bold;
        font-size: 1.1rem;
        color: #ccc;
        pointer-events: none;
      }
      .thumb-preview {
        width: 100%;
        height: 160px;
        border: 1px solid #444;
        background-color: #111;
        border-radius: 5px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #555;
        font-size: 0.9rem;
        overflow: hidden;
        pointer-events: none;
      }
      .thumb-preview img {
        max-width: 100%;
        max-height: 100%;
        object-fit: contain;
      }

      /* Red Remove Button Style */
      .remove-btn {
        display: none; /* Hidden by default */
        position: absolute;
        top: 10px;
        right: 10px;
        background-color: #e74c3c;
        color: white;
        border: none;
        border-radius: 4px;
        padding: 5px 10px;
        font-size: 0.75rem;
        font-weight: bold;
        cursor: pointer;
        transition: background 0.2s;
        z-index: 10;
      }
      .remove-btn:hover {
        background-color: #c0392b;
      }
      /* Show the remove button only when an image is loaded */
      .paste-box.has-image .remove-btn {
        display: block;
      }

      /* Hide Right Box when DM is in Single Layout */
      .dm-single #paste-box-2 {
        display: none;
      }

      /* Player View Window Styling */
      #display-container {
        display: none;
        width: 100vw;
        height: 100vh;
        justify-content: center;
        align-items: center;
        background-color: #1a1a1a;
        box-sizing: border-box;
        padding: 20px;
        gap: 20px;
      }
      .player-img {
        max-height: 100%;
        object-fit: contain;
        display: none;
      }

      /* Only show images if they actually have a src attribute */
      #display-container.layout-single #img-left[src] {
        display: block;
        max-width: 100%;
      }

      #display-container.layout-dual #img-left[src],
      #display-container.layout-dual #img-right[src] {
        display: block;
        max-width: calc(50% - 10px);
      }

      /* Stylized placeholder for the players */
      #player-placeholder {
        font-size: 1.8rem;
        color: #444;
        font-weight: bold;
        text-align: center;
        border: 2px dashed #333;
        padding: 40px 60px;
        border-radius: 10px;
      }

      /* Blackout Screen Mask */
      #blackout-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background-color: #1a1a1a;
        display: none;
        z-index: 9999;
      }
    </style>
  </head>
  <body>
    <!-- Role Selection (Shows on load) -->
    <div id="setup">
      <h2>Select Role for this Window:</h2>
      <button class="role-btn" onclick="initRole('dm')">DM (Sender)</button>
      <button class="role-btn" onclick="initRole('player')">
        Players (Receiver)
      </button>
    </div>

    <!-- DM View -->
    <div id="dm-view" style="display: none" class="dm-single">
      <h2>DM Control Panel</h2>

      <!-- Controls -->
      <div class="control-group">
        <button
          class="control-btn active"
          id="btn-single"
          onclick="setLayout('single')"
        >
          Single View
        </button>
        <button class="control-btn" id="btn-dual" onclick="setLayout('dual')">
          Dual (Side-by-Side)
        </button>
        <button
          class="control-btn"
          id="btn-blackout"
          onclick="toggleBlackout()"
        >
          Hide Screen (Blackout)
        </button>
      </div>

      <p style="font-size: 0.9rem; color: #aaa">
        Click to focus and paste ('Ctrl + V'), or drag and drop an image file
        directly into a box below.
      </p>

      <!-- Paste/Drop Areas -->
      <div class="paste-container">
        <div
          id="paste-box-1"
          class="paste-box"
          tabindex="0"
          onclick="this.focus()"
        >
          <span class="box-label">Left / Main Image</span>
          <div class="thumb-preview" id="thumb-1">No Image Loaded</div>
          <button class="remove-btn" onclick="clearImage(1, event)">
            Remove
          </button>
        </div>
        <div
          id="paste-box-2"
          class="paste-box"
          tabindex="0"
          onclick="this.focus()"
        >
          <span class="box-label">Right Image</span>
          <div class="thumb-preview" id="thumb-2">No Image Loaded</div>
          <button class="remove-btn" onclick="clearImage(2, event)">
            Remove
          </button>
        </div>
      </div>

      <p>Status: <span id="status" style="color: #2ecc71">Ready</span></p>
    </div>

    <!-- Player View Container -->
    <div id="display-container" class="layout-single">
      <div id="player-placeholder">Waiting for DM...</div>
      <img id="img-left" class="player-img" alt="Left View" />
      <img id="img-right" class="player-img" alt="Right View" />
    </div>

    <!-- Blackout Screen Overlay -->
    <div id="blackout-overlay"></div>

    <script>
      const channel = new BroadcastChannel("dm_screen_share_pro");
      let isBlackout = false;

      function initRole(role) {
        document.getElementById("setup").style.display = "none";

        if (role === "dm") {
          document.getElementById("dm-view").style.display = "block";
          setupDM();
        } else {
          document.getElementById("display-container").style.display = "flex";
          setupPlayer();
        }
      }

      // --- Shared Image Processor ---
      function processImageFile(file, slot) {
        if (!file || !file.type.startsWith("image/")) return;

        const status = document.getElementById("status");
        status.textContent = "Processing image...";
        status.style.color = "#e67e22";

        const reader = new FileReader();

        reader.onload = function (event) {
          const base64Image = event.target.result;

          // 1. Update DM Thumbnail and mark box as loaded
          const box = document.getElementById("paste-box-" + slot);
          box.classList.add("has-image");

          const thumb = document.getElementById("thumb-" + slot);
          thumb.innerHTML = `<img src="${base64Image}" alt="Thumbnail">`;

          // 2. Send image data to Player View
          channel.postMessage({ type: "image", slot: slot, data: base64Image });

          status.textContent = `Image ${slot} updated!`;
          status.style.color = "#2ecc71";
        };

        reader.readAsDataURL(file);
      }

      // --- DM logic ---
      function setupDM() {
        setupBoxListeners(document.getElementById("paste-box-1"), 1);
        setupBoxListeners(document.getElementById("paste-box-2"), 2);

        // Auto-focus the first box on load
        document.getElementById("paste-box-1").focus();
      }

      function setupBoxListeners(element, slot) {
        // 1. Paste Event
        element.addEventListener("paste", (e) => {
          const items = e.clipboardData.items;
          for (let i = 0; i < items.length; i++) {
            if (items[i].type.startsWith("image/")) {
              const file = items[i].getAsFile();
              processImageFile(file, slot);
              break;
            }
          }
        });

        // 2. Drag and Drop Events
        ["dragenter", "dragover", "dragleave", "drop"].forEach((eventName) => {
          element.addEventListener(eventName, (e) => e.preventDefault(), false);
        });

        ["dragenter", "dragover"].forEach((eventName) => {
          element.addEventListener(
            eventName,
            () => {
              element.classList.add("drag-over");
            },
            false,
          );
        });

        ["dragleave", "drop"].forEach((eventName) => {
          element.addEventListener(
            eventName,
            () => {
              element.classList.remove("drag-over");
            },
            false,
          );
        });

        element.addEventListener("drop", (e) => {
          const files = e.dataTransfer.files;
          if (files.length > 0) {
            processImageFile(files[0], slot);
          }
        });
      }

      // Clear loaded image
      function clearImage(slot, event) {
        if (event) {
          event.stopPropagation(); // Prevents the parent box from triggering "focus" click event
        }

        const box = document.getElementById("paste-box-" + slot);
        box.classList.remove("has-image");

        const thumb = document.getElementById("thumb-" + slot);
        thumb.innerHTML = "No Image Loaded";

        // Send clear signal to Player View
        channel.postMessage({ type: "clear", slot: slot });

        const status = document.getElementById("status");
        status.textContent = `Image ${slot} removed!`;
        status.style.color = "#e74c3c";
      }

      function setLayout(mode) {
        document
          .getElementById("btn-single")
          .classList.toggle("active", mode === "single");
        document
          .getElementById("btn-dual")
          .classList.toggle("active", mode === "dual");

        document.getElementById("dm-view").className = "dm-" + mode;

        channel.postMessage({ type: "layout", mode: mode });
      }

      function toggleBlackout() {
        isBlackout = !isBlackout;
        const btn = document.getElementById("btn-blackout");

        btn.textContent = isBlackout ? "Show Screen" : "Hide Screen (Blackout)";
        btn.classList.toggle("blackout-active", isBlackout);

        channel.postMessage({ type: "blackout", active: isBlackout });
      }

      // --- Player logic ---
      function setupPlayer() {
        channel.onmessage = function (event) {
          const msg = event.data;
          if (!msg) return;

          if (msg.type === "image") {
            const imgElement = document.getElementById(
              msg.slot === 1 ? "img-left" : "img-right",
            );
            imgElement.src = msg.data;
            updatePlaceholderVisibility();
          } else if (msg.type === "clear") {
            const imgElement = document.getElementById(
              msg.slot === 1 ? "img-left" : "img-right",
            );
            imgElement.removeAttribute("src");
            updatePlaceholderVisibility();
          } else if (msg.type === "layout") {
            const container = document.getElementById("display-container");
            container.className = "layout-" + msg.mode;
            updatePlaceholderVisibility();
          } else if (msg.type === "blackout") {
            document.getElementById("blackout-overlay").style.display =
              msg.active ? "block" : "none";
          }
        };
      }

      // Smart logic to decide if "Waiting for DM..." placeholder should be shown
      function updatePlaceholderVisibility() {
        const container = document.getElementById("display-container");
        const imgLeft = document.getElementById("img-left");
        const imgRight = document.getElementById("img-right");
        const placeholder = document.getElementById("player-placeholder");

        const isSingle = container.classList.contains("layout-single");
        const hasLeft = imgLeft.hasAttribute("src");
        const hasRight = imgRight.hasAttribute("src");

        let shouldShowPlaceholder = false;

        if (isSingle) {
          // In single layout, show placeholder if the main (left) image is missing
          shouldShowPlaceholder = !hasLeft;
        } else {
          // In dual layout, show placeholder if BOTH images are missing
          shouldShowPlaceholder = !hasLeft && !hasRight;
        }

        placeholder.style.display = shouldShowPlaceholder ? "block" : "none";
      }
    </script>
  </body>
</html>
