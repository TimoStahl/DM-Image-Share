<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>DM Image Share</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        background-color: #1a1a1a;
        color: #ffffff;
        font-family: system-ui, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        overflow: hidden;
      }
      #setup {
        text-align: center;
      }
      .role-btn {
        padding: 15px 30px;
        font-size: 1.2rem;
        margin: 10px;
        cursor: pointer;
        border: none;
        border-radius: 5px;
        background-color: #444;
        color: white;
        transition: background 0.2s;
      }
      .role-btn:hover {
        background-color: #666;
      }

      /* DM Control Panel Panel Styling */
      #dm-view {
        text-align: center;
        max-width: 1100px;
        width: 95%;
        max-height: 95vh;
        overflow-y: auto;
        padding: 20px;
        box-sizing: border-box;
      }
      .control-group {
        margin-bottom: 15px;
      }
      .control-btn {
        padding: 10px 20px;
        font-size: 1rem;
        margin: 5px;
        cursor: pointer;
        border: 2px solid #555;
        background-color: #222;
        color: white;
        border-radius: 5px;
        transition: all 0.2s;
      }
      .control-btn:hover {
        background-color: #333;
      }
      .control-btn.blackout-active {
        border-color: #e74c3c;
        background-color: #3d1b1b;
      }

      /* 10-Slot Grid Container */
      #slots-container {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
        gap: 15px;
        margin-top: 15px;
        width: 100%;
      }

      /* Interactive Card for each slot */
      .slot-card {
        background-color: #222;
        border: 3px dashed #555;
        border-radius: 8px;
        padding: 10px;
        cursor: pointer;
        outline: none;
        display: flex;
        flex-direction: column;
        transition: all 0.2s;
        position: relative;
      }
      .slot-card:focus-within {
        border-color: #3498db;
        background-color: #1a2a3a;
      }
      .slot-card.drag-over {
        border-color: #2ecc71;
        background-color: #1b3d22;
      }
      .slot-card.has-image {
        border-style: solid;
        border-color: #444;
      }
      .slot-card.has-image.showing {
        border-color: #2ecc71;
      }

      .slot-header {
        font-weight: bold;
        font-size: 0.9rem;
        margin-bottom: 8px;
        color: #aaa;
        pointer-events: none;
      }
      .thumb-preview {
        width: 100%;
        height: 110px;
        border: 1px solid #333;
        background-color: #111;
        border-radius: 4px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #444;
        font-size: 0.8rem;
        overflow: hidden;
        pointer-events: none;
      }
      .thumb-preview img {
        max-width: 100%;
        max-height: 100%;
        object-fit: contain;
      }

      /* DM Caption Input Styling */
      .caption-input {
        width: 100%;
        padding: 6px;
        margin-top: 8px;
        background-color: #111;
        border: 1px solid #444;
        color: white;
        border-radius: 4px;
        box-sizing: border-box;
        font-size: 0.85rem;
        outline: none;
        transition: border-color 0.2s;
      }
      .caption-input:focus {
        border-color: #3498db;
      }
      .caption-input:disabled {
        opacity: 0.3;
        cursor: not-allowed;
      }

      /* Small Controls underneath each preview card */
      .slot-controls {
        display: flex;
        gap: 5px;
        margin-top: 8px;
      }
      .slot-btn {
        flex: 1;
        padding: 6px;
        font-size: 0.75rem;
        font-weight: bold;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        color: white;
        transition:
          background 0.2s,
          opacity 0.2s;
      }
      .slot-btn:disabled {
        opacity: 0.3;
        cursor: not-allowed;
        background-color: #333 !important;
      }
      .toggle-btn {
        background-color: #444;
      }
      .toggle-btn.showing {
        background-color: #2ecc71;
      }
      .toggle-btn.showing:hover {
        background-color: #27ae60;
      }
      .remove-btn {
        background-color: #e74c3c;
      }
      .remove-btn:hover {
        background-color: #c0392b;
      }

      /* Player View Window Styling */
      #display-container {
        display: none;
        width: 100vw;
        height: 100vh;
        justify-content: center;
        align-items: center;
        background-color: #1a1a1a;
        box-sizing: border-box;
        padding: 20px;
        gap: 20px;
        overflow: hidden;
      }

      /* Protective wrapper prevents track blowout and organizes vertical alignment */
      .player-img-wrapper {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }

      /* Force image to scale down cleanly, leaving room for the caption */
      .player-img {
        flex: 1;
        min-height: 0;
        max-width: 100%;
        max-height: 100%;
        object-fit: contain;
        border-radius: 4px;
      }

      /* Stylized caption for players */
      .player-caption {
        margin-top: 10px;
        font-size: 1.4rem;
        font-weight: bold;
        text-align: center;
        color: #ffffff;
        background-color: rgba(0, 0, 0, 0.7);
        padding: 6px 16px;
        border-radius: 5px;
        max-width: 90%;
        word-wrap: break-word;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        flex-shrink: 0;
      }

      /* Stylized placeholder for the players */
      #player-placeholder {
        font-size: 1.8rem;
        color: #444;
        font-weight: bold;
        text-align: center;
        border: 2px dashed #333;
        padding: 40px 60px;
        border-radius: 10px;
      }

      /* Blackout Screen Mask */
      #blackout-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background-color: #1a1a1a;
        display: none;
        z-index: 9999;
      }
    </style>
  </head>
  <body>
    <!-- Role Selection (Shows on load) -->
    <div id="setup">
      <h2>Select Role for this Window:</h2>
      <button class="role-btn" onclick="initRole('dm')">DM (Sender)</button>
      <button class="role-btn" onclick="initRole('player')">
        Players (Receiver)
      </button>
    </div>

    <!-- DM View -->
    <div id="dm-view" style="display: none">
      <h2>DM Control Panel</h2>

      <!-- Controls -->
      <div class="control-group">
        <button
          class="control-btn"
          id="btn-blackout"
          onclick="toggleBlackout()"
        >
          Hide Screen (Blackout)
        </button>
        <button class="control-btn" onclick="exportSession()">
          Export Session
        </button>
        <button class="control-btn" onclick="triggerImport()">
          Import Session
        </button>
        <input
          type="file"
          id="import-file-input"
          accept=".json"
          style="display: none"
          onchange="importSession(event)"
        />
      </div>

      <p style="font-size: 0.9rem; color: #aaa; margin-bottom: 5px">
        Click a slot to select it, then paste ('Ctrl + V'), or drag and drop an
        image file directly into it.
      </p>

      <!-- Dynamic Grid of 10 slots populated by JS -->
      <div id="slots-container"></div>

      <p style="margin-top: 20px">
        Status: <span id="status" style="color: #2ecc71">Ready</span>
      </p>
    </div>

    <!-- Player View Container -->
    <div id="display-container">
      <div id="player-placeholder">Waiting for DM...</div>
    </div>

    <!-- Blackout Screen Overlay -->
    <div id="blackout-overlay"></div>

    <script>
      const channel = new BroadcastChannel("dm_screen_share_pro_grid");
      let isBlackout = false;

      // DM State tracking for 10 slots
      let slots = Array.from({ length: 10 }, (_, i) => ({
        id: i + 1,
        image: null,
        caption: "",
        visible: false,
      }));

      function initRole(role) {
        document.getElementById("setup").style.display = "none";

        if (role === "dm") {
          document.getElementById("dm-view").style.display = "block";
          setupDM();
        } else {
          setupPlayer();
          renderPlayerGrid([]);
        }
      }

      // --- DM logic ---
      function setupDM() {
        const container = document.getElementById("slots-container");

        // Build the 10 slots programmatically
        for (let i = 1; i <= 10; i++) {
          const card = document.createElement("div");
          card.className = "slot-card";
          card.id = `slot-card-${i}`;
          card.dataset.slot = i;
          card.tabIndex = 0;

          card.innerHTML = `
                    <div class="slot-header">Slot ${i}</div>
                    <div class="thumb-preview" id="thumb-${i}">No Image Loaded</div>
                    <input type="text" class="caption-input" id="caption-${i}" placeholder="Enter caption..." oninput="updateCaption(${i}, this.value)" disabled>
                    <div class="slot-controls">
                        <button class="slot-btn toggle-btn" id="toggle-${i}" onclick="toggleSlot(${i}, event)" disabled>Show</button>
                        <button class="slot-btn remove-btn" id="remove-${i}" onclick="clearSlot(${i}, event)" disabled>Remove</button>
                    </div>
                `;

          container.appendChild(card);
          setupBoxListeners(card, i);
        }

        // Global Paste Listener
        document.addEventListener("paste", (e) => {
          const activeCard = document.activeElement;

          if (activeCard && activeCard.classList.contains("slot-card")) {
            const slotId = parseInt(activeCard.dataset.slot);
            const items = e.clipboardData.items;
            for (let i = 0; i < items.length; i++) {
              if (items[i].type.startsWith("image/")) {
                const file = items[i].getAsFile();
                processImageFile(file, slotId);
                break;
              }
            }
          }
        });

        // Focus first card by default
        document.getElementById("slot-card-1").focus();
      }

      function setupBoxListeners(element, slotId) {
        // Drag and Drop Events
        ["dragenter", "dragover", "dragleave", "drop"].forEach((eventName) => {
          element.addEventListener(eventName, (e) => e.preventDefault(), false);
        });

        ["dragenter", "dragover"].forEach((eventName) => {
          element.addEventListener(
            eventName,
            () => {
              element.classList.add("drag-over");
            },
            false,
          );
        });

        ["dragleave", "drop"].forEach((eventName) => {
          element.addEventListener(
            eventName,
            () => {
              element.classList.remove("drag-over");
            },
            false,
          );
        });

        element.addEventListener("drop", (e) => {
          const files = e.dataTransfer.files;
          if (files.length > 0) {
            processImageFile(files[0], slotId);
          }
        });

        element.addEventListener("click", (e) => {
          if (e.target.tagName !== "INPUT" && e.target.tagName !== "BUTTON") {
            element.focus();
          }
        });
      }

      // Shared Image Processor
      function processImageFile(file, slotId) {
        if (!file || !file.type.startsWith("image/")) return;

        const status = document.getElementById("status");
        status.textContent = "Processing image...";
        status.style.color = "#e67e22";

        const reader = new FileReader();

        reader.onload = function (event) {
          const base64Image = event.target.result;
          const idx = slotId - 1;

          slots[idx].image = base64Image;
          slots[idx].visible = false;

          updateSlotUI(slotId);
          broadcastState();

          status.textContent = `Slot ${slotId} loaded privately!`;
          status.style.color = "#2ecc71";
        };

        reader.readAsDataURL(file);
      }

      // Core UI Renderer - Single Source of Truth for rendering Slot States
      function updateSlotUI(slotId) {
        const idx = slotId - 1;
        const slot = slots[idx];
        const card = document.getElementById(`slot-card-${slotId}`);
        const thumb = document.getElementById(`thumb-${slotId}`);
        const toggleBtn = document.getElementById(`toggle-${slotId}`);
        const removeBtn = document.getElementById(`remove-${slotId}`);
        const captionInput = document.getElementById(`caption-${slotId}`);

        if (slot.image) {
          card.classList.add("has-image");
          thumb.innerHTML = `<img src="${slot.image}" alt="Thumbnail">`;
          toggleBtn.disabled = false;
          removeBtn.disabled = false;
          captionInput.disabled = false;
          captionInput.value = slot.caption || "";

          if (slot.visible) {
            card.classList.add("showing");
            toggleBtn.textContent = "Hide";
            toggleBtn.classList.add("showing");
          } else {
            card.classList.remove("showing");
            toggleBtn.textContent = "Show";
            toggleBtn.classList.remove("showing");
          }
        } else {
          card.className = "slot-card";
          thumb.innerHTML = "No Image Loaded";
          toggleBtn.textContent = "Show";
          toggleBtn.classList.remove("showing");
          toggleBtn.disabled = true;
          removeBtn.disabled = true;
          captionInput.value = "";
          captionInput.disabled = true;
        }
      }

      function updateCaption(slotId, text) {
        const idx = slotId - 1;
        slots[idx].caption = text;
        broadcastState();
      }

      function toggleSlot(slotId, event) {
        if (event) event.stopPropagation();

        const idx = slotId - 1;
        if (!slots[idx].image) return;

        slots[idx].visible = !slots[idx].visible;

        updateSlotUI(slotId);
        broadcastState();
      }

      function clearSlot(slotId, event) {
        if (event) event.stopPropagation();

        const idx = slotId - 1;
        slots[idx].image = null;
        slots[idx].visible = false;
        slots[idx].caption = "";

        updateSlotUI(slotId);
        broadcastState();

        const status = document.getElementById("status");
        status.textContent = `Slot ${slotId} removed!`;
        status.style.color = "#e74c3c";
      }

      function toggleBlackout() {
        isBlackout = !isBlackout;
        const btn = document.getElementById("btn-blackout");

        btn.textContent = isBlackout ? "Show Screen" : "Hide Screen (Blackout)";
        btn.classList.toggle("blackout-active", isBlackout);

        channel.postMessage({ type: "blackout", active: isBlackout });
      }

      // --- SESSION IMPORT & EXPORT LOGIC ---
      function exportSession() {
        const jsonString = JSON.stringify(slots);
        const blob = new Blob([jsonString], { type: "application/json" });
        const url = URL.createObjectURL(blob);

        const a = document.createElement("a");
        a.href = url;
        a.download = `dm_session_${new Date().toISOString().slice(0, 10)}.json`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);

        const status = document.getElementById("status");
        status.textContent = "Session exported successfully!";
        status.style.color = "#2ecc71";
      }

      function triggerImport() {
        document.getElementById("import-file-input").click();
      }

      function importSession(event) {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function (e) {
          try {
            const importedSlots = JSON.parse(e.target.result);
            if (Array.isArray(importedSlots) && importedSlots.length === 10) {
              slots = importedSlots;
              // Re-render each Slot's UI card
              for (let i = 1; i <= 10; i++) {
                updateSlotUI(i);
              }
              broadcastState();

              const status = document.getElementById("status");
              status.textContent = "Session loaded successfully!";
              status.style.color = "#2ecc71";
            } else {
              alert("Invalid save file format.");
            }
          } catch (err) {
            alert("Failed to parse save file.");
          }
          event.target.value = ""; // Reset input
        };
        reader.readAsText(file);
      }

      function broadcastState() {
        const visibleItems = slots
          .filter((s) => s.image && s.visible)
          .map((s) => ({ image: s.image, caption: s.caption }));

        channel.postMessage({ type: "sync", items: visibleItems });
      }

      // --- Player logic ---
      function setupPlayer() {
        channel.onmessage = function (event) {
          const msg = event.data;
          if (!msg) return;

          if (msg.type === "sync") {
            renderPlayerGrid(msg.items);
          } else if (msg.type === "blackout") {
            document.getElementById("blackout-overlay").style.display =
              msg.active ? "block" : "none";
          }
        };
      }

      function renderPlayerGrid(items) {
        const container = document.getElementById("display-container");
        const placeholder = document.getElementById("player-placeholder");

        const currentWrappers = container.querySelectorAll(
          ".player-img-wrapper",
        );
        currentWrappers.forEach((wrap) => wrap.remove());

        const itemsToShow = items.slice(0, 9);

        if (!itemsToShow || itemsToShow.length === 0) {
          placeholder.style.display = "block";
          container.style.display = "flex";
          container.style.gridTemplateColumns = "";
          container.style.gridTemplateRows = "";
          return;
        }

        placeholder.style.display = "none";
        container.style.display = "grid";

        const n = itemsToShow.length;
        const config = getGridConfig(n);
        container.style.gridTemplateColumns = config.cols;
        container.style.gridTemplateRows = config.rows;

        itemsToShow.forEach((item) => {
          const wrapper = document.createElement("div");
          wrapper.className = "player-img-wrapper";

          const img = document.createElement("img");
          img.className = "player-img";
          img.src = item.image;
          wrapper.appendChild(img);

          if (item.caption && item.caption.trim() !== "") {
            const caption = document.createElement("div");
            caption.className = "player-caption";
            caption.textContent = item.caption;
            wrapper.appendChild(caption);
          }

          container.appendChild(wrapper);
        });
      }

      function getGridConfig(n) {
        if (n === 1) return { cols: "1fr", rows: "1fr" };
        if (n === 2) return { cols: "1fr 1fr", rows: "1fr" };
        if (n === 3) return { cols: "1fr 1fr", rows: "1fr 1fr" };
        if (n === 4) return { cols: "1fr 1fr", rows: "1fr 1fr" };
        if (n === 5) return { cols: "1fr 1fr 1fr", rows: "1fr 1fr" };
        if (n === 6) return { cols: "1fr 1fr 1fr", rows: "1fr 1fr" };
        if (n === 7) return { cols: "1fr 1fr 1fr 1fr", rows: "1fr 1fr" };
        if (n === 8) return { cols: "1fr 1fr 1fr 1fr", rows: "1fr 1fr" };
        if (n === 9) return { cols: "1fr 1fr 1fr", rows: "1fr 1fr 1fr" };
        return { cols: "1fr 1fr 1fr", rows: "1fr 1fr 1fr" };
      }
    </script>
  </body>
</html>
