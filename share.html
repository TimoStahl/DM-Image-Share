<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>DM Screen Share</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        background-color: #1a1a1a;
        color: #ffffff;
        font-family: system-ui, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        overflow: hidden;
      }
      #setup {
        text-align: center;
      }
      .role-btn {
        padding: 15px 30px;
        font-size: 1.2rem;
        margin: 10px;
        cursor: pointer;
        border: none;
        border-radius: 5px;
        background-color: #444;
        color: white;
        transition: background 0.2s;
      }
      .role-btn:hover {
        background-color: #666;
      }
      #dm-view {
        text-align: center;
      }
      #paste-area {
        border: 3px dashed #666;
        border-radius: 10px;
        padding: 60px 100px;
        margin-top: 20px;
        cursor: pointer;
        font-size: 1.2rem;
        background-color: #222;
      }
      #paste-area:hover {
        border-color: #888;
        background-color: #2a2a2a;
      }
      #display-img {
        max-width: 100vw;
        max-height: 100vh;
        object-fit: contain;
        display: none;
      }
    </style>
  </head>
  <body>
    <!-- Role Selection (Shows on load) -->
    <div id="setup">
      <h2>Select Role for this Window:</h2>
      <button class="role-btn" onclick="initRole('dm')">DM (Sender)</button>
      <button class="role-btn" onclick="initRole('player')">
        Players (Receiver)
      </button>
    </div>

    <!-- DM View -->
    <div id="dm-view" style="display: none">
      <h2>DM Control Panel</h2>
      <p>Click inside the box and press 'Ctrl + V' to paste your screenshot.</p>
      <div id="paste-area">Paste Image Here</div>
      <p>Status: <span id="status" style="color: #888">Ready</span></p>
    </div>

    <!-- Player View Image -->
    <img id="display-img" alt="Shared Screen" />

    <script>
      // Setup the communication channel
      const channel = new BroadcastChannel("dm_screen_share");

      function initRole(role) {
        document.getElementById("setup").style.display = "none";

        if (role === "dm") {
          document.getElementById("dm-view").style.display = "block";
          setupDM();
        } else {
          document.getElementById("display-img").style.display = "block";
          setupPlayer();
        }
      }

      function setupDM() {
        const status = document.getElementById("status");

        // Listen for the paste event on the document
        document.addEventListener("paste", (e) => {
          const items = e.clipboardData.items;
          for (let i = 0; i < items.length; i++) {
            // Check if the pasted item is an image
            if (items[i].type.startsWith("image/")) {
              const file = items[i].getAsFile();
              const reader = new FileReader();

              status.textContent = "Processing image...";
              status.style.color = "#e67e22";

              reader.onload = function (event) {
                const base64Image = event.target.result;
                // Send the image to the player tab
                channel.postMessage({ image: base64Image });
                status.textContent = "Sent successfully!";
                status.style.color = "#2ecc71";
              };

              reader.readAsDataURL(file);
              break;
            }
          }
        });
      }

      function setupPlayer() {
        const displayImg = document.getElementById("display-img");

        // Listen for images sent from the DM tab
        channel.onmessage = function (event) {
          if (event.data && event.data.image) {
            displayImg.src = event.data.image;
          }
        };
      }
    </script>
  </body>
</html>
