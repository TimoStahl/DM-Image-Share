<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>DM Screen Share</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        background-color: #1a1a1a;
        color: #ffffff;
        font-family: system-ui, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        overflow: hidden;
      }
      #setup {
        text-align: center;
      }
      .role-btn {
        padding: 15px 30px;
        font-size: 1.2rem;
        margin: 10px;
        cursor: pointer;
        border: none;
        border-radius: 5px;
        background-color: #444;
        color: white;
        transition: background 0.2s;
      }
      .role-btn:hover {
        background-color: #666;
      }

      /* DM Control Panel Panel Styling */
      #dm-view {
        text-align: center;
        max-width: 800px;
        width: 90%;
      }
      .control-group {
        margin-bottom: 20px;
      }
      .control-btn {
        padding: 10px 20px;
        font-size: 1rem;
        margin: 5px;
        cursor: pointer;
        border: 2px solid #555;
        background-color: #222;
        color: white;
        border-radius: 5px;
        transition: all 0.2s;
      }
      .control-btn:hover {
        background-color: #333;
      }
      .control-btn.active {
        border-color: #2ecc71;
        background-color: #1b3d22;
      }
      .control-btn.blackout-active {
        border-color: #e74c3c;
        background-color: #3d1b1b;
      }

      /* Interactive Paste/Drop Boxes */
      .paste-container {
        display: flex;
        justify-content: center;
        gap: 20px;
        margin-top: 20px;
        height: 250px;
      }
      .paste-box {
        flex: 1;
        border: 3px dashed #666;
        border-radius: 10px;
        padding: 15px;
        cursor: pointer;
        background-color: #222;
        outline: none;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: space-between;
        transition: all 0.2s;
        box-sizing: border-box;
      }
      .paste-box:focus {
        border-color: #3498db;
        background-color: #1a2a3a;
      }
      /* Highlight box when dragging a file over it */
      .paste-box.drag-over {
        border-color: #2ecc71;
        background-color: #1b3d22;
      }
      .box-label {
        font-weight: bold;
        font-size: 1.1rem;
        color: #ccc;
        pointer-events: none; /* Prevents interference with drag/drop target */
      }
      .thumb-preview {
        width: 100%;
        height: 160px;
        border: 1px solid #444;
        background-color: #111;
        border-radius: 5px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #555;
        font-size: 0.9rem;
        overflow: hidden;
        pointer-events: none; /* Prevents interference with drag/drop target */
      }
      .thumb-preview img {
        max-width: 100%;
        max-height: 100%;
        object-fit: contain;
      }

      /* Hide Right Box when DM is in Single Layout */
      .dm-single #paste-box-2 {
        display: none;
      }

      /* Player View Window Styling */
      #display-container {
        display: none;
        width: 100vw;
        height: 100vh;
        justify-content: center;
        align-items: center;
        background-color: #1a1a1a;
        box-sizing: border-box;
        padding: 20px;
        gap: 20px;
      }
      .player-img {
        max-height: 100%;
        object-fit: contain;
        display: none;
      }

      /* Player View Single Layout Rule */
      #display-container.layout-single #img-left {
        display: block;
        max-width: 100%;
      }

      /* Player View Dual Layout Rule */
      #display-container.layout-dual #img-left,
      #display-container.layout-dual #img-right {
        display: block;
        max-width: calc(50% - 10px);
      }

      /* Blackout Screen Mask */
      #blackout-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background-color: #1a1a1a;
        display: none;
        z-index: 9999;
      }
    </style>
  </head>
  <body>
    <!-- Role Selection (Shows on load) -->
    <div id="setup">
      <h2>Select Role for this Window:</h2>
      <button class="role-btn" onclick="initRole('dm')">DM (Sender)</button>
      <button class="role-btn" onclick="initRole('player')">
        Players (Receiver)
      </button>
    </div>

    <!-- DM View -->
    <div id="dm-view" style="display: none" class="dm-single">
      <h2>DM Control Panel</h2>

      <!-- Controls -->
      <div class="control-group">
        <button
          class="control-btn active"
          id="btn-single"
          onclick="setLayout('single')"
        >
          Single View
        </button>
        <button class="control-btn" id="btn-dual" onclick="setLayout('dual')">
          Dual (Side-by-Side)
        </button>
        <button
          class="control-btn"
          id="btn-blackout"
          onclick="toggleBlackout()"
        >
          Hide Screen (Blackout)
        </button>
      </div>

      <p style="font-size: 0.9rem; color: #aaa">
        Click to focus and paste ('Ctrl + V'), or drag and drop an image file
        directly into a box below.
      </p>

      <!-- Paste/Drop Areas -->
      <div class="paste-container">
        <div
          id="paste-box-1"
          class="paste-box"
          tabindex="0"
          onclick="this.focus()"
        >
          <span class="box-label">Left / Main Image</span>
          <div class="thumb-preview" id="thumb-1">No Image Loaded</div>
        </div>
        <div
          id="paste-box-2"
          class="paste-box"
          tabindex="0"
          onclick="this.focus()"
        >
          <span class="box-label">Right Image</span>
          <div class="thumb-preview" id="thumb-2">No Image Loaded</div>
        </div>
      </div>

      <p>Status: <span id="status" style="color: #2ecc71">Ready</span></p>
    </div>

    <!-- Player View Container -->
    <div id="display-container" class="layout-single">
      <img id="img-left" class="player-img" alt="Left View" />
      <img id="img-right" class="player-img" alt="Right View" />
    </div>

    <!-- Blackout Screen Overlay -->
    <div id="blackout-overlay"></div>

    <script>
      const channel = new BroadcastChannel("dm_screen_share_pro");
      let isBlackout = false;

      function initRole(role) {
        document.getElementById("setup").style.display = "none";

        if (role === "dm") {
          document.getElementById("dm-view").style.display = "block";
          setupDM();
        } else {
          document.getElementById("display-container").style.display = "flex";
          setupPlayer();
        }
      }

      // --- Shared Image Processor ---
      function processImageFile(file, slot) {
        if (!file || !file.type.startsWith("image/")) return;

        const status = document.getElementById("status");
        status.textContent = "Processing image...";
        status.style.color = "#e67e22";

        const reader = new FileReader();

        reader.onload = function (event) {
          const base64Image = event.target.result;

          // 1. Update DM Thumbnail
          const thumb = document.getElementById("thumb-" + slot);
          thumb.innerHTML = `<img src="${base64Image}" alt="Thumbnail">`;

          // 2. Send image data to Player View
          channel.postMessage({ type: "image", slot: slot, data: base64Image });

          status.textContent = `Image ${slot} updated!`;
          status.style.color = "#2ecc71";
        };

        reader.readAsDataURL(file);
      }

      // --- DM logic ---
      function setupDM() {
        setupBoxListeners(document.getElementById("paste-box-1"), 1);
        setupBoxListeners(document.getElementById("paste-box-2"), 2);

        // Auto-focus the first box on load
        document.getElementById("paste-box-1").focus();
      }

      function setupBoxListeners(element, slot) {
        // 1. Paste Event
        element.addEventListener("paste", (e) => {
          const items = e.clipboardData.items;
          for (let i = 0; i < items.length; i++) {
            if (items[i].type.startsWith("image/")) {
              const file = items[i].getAsFile();
              processImageFile(file, slot);
              break;
            }
          }
        });

        // 2. Drag and Drop Events
        // Prevent default system actions for dragging files
        ["dragenter", "dragover", "dragleave", "drop"].forEach((eventName) => {
          element.addEventListener(eventName, (e) => e.preventDefault(), false);
        });

        // Add highlight class when dragging file over the box
        ["dragenter", "dragover"].forEach((eventName) => {
          element.addEventListener(
            eventName,
            () => {
              element.classList.add("drag-over");
            },
            false,
          );
        });

        // Remove highlight class when leaving or dropping
        ["dragleave", "drop"].forEach((eventName) => {
          element.addEventListener(
            eventName,
            () => {
              element.classList.remove("drag-over");
            },
            false,
          );
        });

        // Handle the dropped file
        element.addEventListener("drop", (e) => {
          const files = e.dataTransfer.files;
          if (files.length > 0) {
            processImageFile(files[0], slot);
          }
        });
      }

      function setLayout(mode) {
        document
          .getElementById("btn-single")
          .classList.toggle("active", mode === "single");
        document
          .getElementById("btn-dual")
          .classList.toggle("active", mode === "dual");

        // Toggle local DM interface classes to show/hide the second box
        document.getElementById("dm-view").className = "dm-" + mode;

        // Broadcast layout change to player screen
        channel.postMessage({ type: "layout", mode: mode });
      }

      function toggleBlackout() {
        isBlackout = !isBlackout;
        const btn = document.getElementById("btn-blackout");

        btn.textContent = isBlackout ? "Show Screen" : "Hide Screen (Blackout)";
        btn.classList.toggle("blackout-active", isBlackout);

        // Broadcast blackout trigger
        channel.postMessage({ type: "blackout", active: isBlackout });
      }

      // --- Player logic ---
      function setupPlayer() {
        channel.onmessage = function (event) {
          const msg = event.data;
          if (!msg) return;

          if (msg.type === "image") {
            const imgElement = document.getElementById(
              msg.slot === 1 ? "img-left" : "img-right",
            );
            imgElement.src = msg.data;
          } else if (msg.type === "layout") {
            const container = document.getElementById("display-container");
            container.className = "layout-" + msg.mode;
          } else if (msg.type === "blackout") {
            document.getElementById("blackout-overlay").style.display =
              msg.active ? "block" : "none";
          }
        };
      }
    </script>
  </body>
</html>
